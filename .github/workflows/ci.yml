name: UptimeHub CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest backend/test_app.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/shimakhatibi/uptimehub:latest \
            -t ghcr.io/shimakhatibi/uptimehub:${{ github.sha }} \
            ./backend

      - name: Push Docker images
        run: |
          docker push ghcr.io/shimakhatibi/uptimehub:latest
          docker push ghcr.io/shimakhatibi/uptimehub:${{ github.sha }}
