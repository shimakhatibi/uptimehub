services:
  uptimehub-api:
    image: ghcr.io/shimakhatibi/uptimehub:latest
    container_name: uptimehub-api
    ports:
      - "5000:5000"
    volumes:
      - uptimehub-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  uptimehub-data:
